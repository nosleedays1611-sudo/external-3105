name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source 1.0.1
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="3105-1.0.1-EXTERNAL-UI-source.zip"

          rm -rf source build Payload
          mkdir -p source

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERRO: $SOURCE_ZIP não encontrado."
            ls -lah
            exit 1
          fi

          echo "Extraindo: $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source

          PROJECT="$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            find source -maxdepth 5 -print
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$PROJECT")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

          echo "Projeto: $PROJECT"
          echo "Source root: $SOURCE_ROOT"

          echo
          echo "Patches encontrados na source:"

          if [ -d "$SOURCE_ROOT/Patches" ]; then
            find "$SOURCE_ROOT/Patches" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -print
          else
            echo "AVISO: pasta Patches ainda não existe."
          fi

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD 3105 1.0.1"
          echo "Projeto: $PROJECT"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "BUILD FALHOU."

            grep -n -E \
              "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 150 || true

            exit "$BUILD_EXIT"
          fi

          echo "BUILD CONCLUÍDO."

      - name: Package IPA with patches
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: 3105.app não encontrado."
            exit 1
          fi

          echo "App encontrado:"
          echo "$APP_PATH"

          PATCHES_DIR="$SOURCE_ROOT/Patches"

          if [ ! -d "$PATCHES_DIR" ]; then
            echo "ERRO: pasta Patches não encontrada:"
            echo "$PATCHES_DIR"
            exit 1
          fi

          PATCH_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l | tr -d ' ')"

          echo "Patches encontrados: $PATCH_COUNT"

          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum arquivo .3105 encontrado."
            echo "Coloque os patches em:"
            echo "ThreeOneOSFive/Patches/"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          # ==================================================
          # COPIA OS .3105 PARA DENTRO DO APP
          # ==================================================

          mkdir -p Payload/3105.app/Patches

          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -exec cp -v {} Payload/3105.app/Patches/ \;

          echo
          echo "========================================"
          echo "PATCHES DENTRO DO APP"
          echo "========================================"

          find Payload/3105.app/Patches \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -print

          FINAL_PATCH_COUNT="$(find Payload/3105.app/Patches \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l | tr -d ' ')"

          echo
          echo "Total dentro do app: $FINAL_PATCH_COUNT"

          if [ "$FINAL_PATCH_COUNT" -ne "$PATCH_COUNT" ]; then
            echo "ERRO: nem todos os patches foram copiados."
            exit 1
          fi

          echo
          echo "Tamanho do app antes da IPA:"
          du -sh Payload/3105.app
          du -sh Payload/3105.app/Patches

          # ==================================================
          # CRIA A IPA SOMENTE DEPOIS DOS PATCHES
          # ==================================================

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          echo
          echo "IPA criada:"
          ls -lh 3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          echo
          echo "Verificando os .3105 dentro da IPA:"

          unzip -l 3105-EXTERNAL-UI-1.0.1-unsigned.ipa \
            | grep '\.3105$'

          IPA_PATCH_COUNT="$(unzip -l \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa \
            | grep -c '\.3105$' || true)"

          echo
          echo "Patches encontrados NA IPA: $IPA_PATCH_COUNT"

          if [ "$IPA_PATCH_COUNT" -ne "$PATCH_COUNT" ]; then
            echo "ERRO: verificação final da IPA falhou."
            exit 1
          fi

          echo
          echo "========================================"
          echo "IPA VALIDADA COM $IPA_PATCH_COUNT PATCH(ES)"
          echo "========================================"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-EXTERNAL-UI-1.0.1-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-1.0.1-log
          path: xcodebuild.log
          if-no-files-found: ignore
