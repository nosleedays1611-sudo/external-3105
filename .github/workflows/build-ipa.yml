          PATCHES_DIR="$ROOT/ThreeOneOSFive/Patches"

          echo
          echo "========================================"
          echo "PREPARANDO PATCH VAULT"
          echo "========================================"

          if [ -d "$PATCHES_DIR" ]; then
            RAW_PATCH_COUNT="$(
              find "$PATCHES_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.3105' \
                | wc -l \
                | tr -d ' '
            )"
          else
            RAW_PATCH_COUNT=0
          fi

          echo ".3105 encontrados para integração: $RAW_PATCH_COUNT"

          if [ "$RAW_PATCH_COUNT" -gt 0 ]; then
            echo
            echo "Patches encontrados:"

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -print

            echo
            echo "Procurando gerador do patchvault..."

            VAULT_GENERATOR=""

            while IFS= read -r FILE; do
              case "$FILE" in
                *.py|*.sh|*.swift)
                  if grep -qE \
                    'patchvault|__pv3105|Patches' \
                    "$FILE" 2>/dev/null; then
                    VAULT_GENERATOR="$FILE"
                    break
                  fi
                  ;;
              esac
            done < <(
              find "$ROOT" \
                -type f \
                \( -name '*.py' \
                   -o -name '*.sh' \
                   -o -name '*.swift' \) \
                -print
            )

            if [ -z "$VAULT_GENERATOR" ]; then
              echo
              echo "ERRO: existem patches novos, mas o gerador do patchvault não foi encontrado."
              echo "Os arquivos NÃO serão apagados."
              exit 1
            fi

            echo "Gerador encontrado:"
            echo "$VAULT_GENERATOR"

            case "$VAULT_GENERATOR" in
              *.py)
                python3 "$VAULT_GENERATOR"
                ;;

              *.sh)
                chmod +x "$VAULT_GENERATOR"
                "$VAULT_GENERATOR"
                ;;

              *.swift)
                swift "$VAULT_GENERATOR"
                ;;
            esac

            if [ ! -s "$VAULT" ]; then
              echo "ERRO: patchvault.bin não foi gerado."
              exit 1
            fi

            echo
            echo "Vault gerado:"
            ls -lh "$VAULT"

            echo
            echo "Removendo .3105 somente após gerar o vault..."

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete
          else
            echo "Nenhum patch novo para integrar."
            echo "Usando patchvault.bin existente."
          fi

          REMAINING_PATCHES="$(
            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo ".3105 restantes: $REMAINING_PATCHES"

          if [ "$REMAINING_PATCHES" -ne 0 ]; then
            echo "ERRO: ainda existem .3105 crus depois da integração."
            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              -print
            exit 1
          fi

          echo
          echo "Source MAX HARDENED preparada."
