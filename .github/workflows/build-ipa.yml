name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source 1.0.1
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="3105-1.0.1-EXTERNAL-UI-source.zip"

          rm -rf source build Payload
          mkdir -p source

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERRO: $SOURCE_ZIP não encontrado."
            echo
            echo "Arquivos disponíveis:"
            ls -lah
            exit 1
          fi

          echo "Extraindo: $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source

          PROJECT="$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            echo
            echo "Conteúdo extraído:"
            find source -maxdepth 5 -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$PROJECT"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD 3105 1.0.1"
          echo "Projeto: $PROJECT"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "========================================"
          echo "xcodebuild exit code: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "BUILD FALHOU."
            echo
            echo "Erros encontrados no log:"
            grep -n -E \
              "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 150 || true

            exit "$BUILD_EXIT"
          fi

          echo "BUILD CONCLUÍDO."

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: 3105.app não encontrado."

            echo
            echo "Conteúdo da pasta build:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 5 \
              -print || true

            exit 1
          fi

          echo "App encontrado:"
          echo "$APP_PATH"

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          echo
          echo "IPA criada:"
          ls -lh 3105-EXTERNAL-UI-1.0.1-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-EXTERNAL-UI-1.0.1-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-unsigned.ipa
          if-no-files-found: error

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-1.0.1-log
          path: xcodebuild.log
          if-no-files-found: ignore
