name: Build 3105 External UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-3105-external-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(find /Applications \
            -maxdepth 1 \
            -type d \
            -name 'Xcode*.app' \
            -print \
            | sort -V \
            | tail -n 1)"

          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found."
            exit 1
          fi

          echo "Using Xcode:"
          echo "$XCODE_APP"

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          echo ""
          echo "Developer directory:"
          xcode-select -p

          echo ""
          xcodebuild -version

          echo ""
          xcodebuild -showsdks

      - name: Locate ThreeOneOSFive project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Xcode project..."

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path '*/ThreeOneOSFive.xcodeproj/project.pbxproj' \
            -print \
            -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::ThreeOneOSFive.xcodeproj/project.pbxproj not found."

            echo ""
            echo "All Xcode projects found:"
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name '*.xcodeproj' \
              -print || true

            echo ""
            echo "Repository root:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -print \
              | sort || true

            exit 1
          fi

          # project.pbxproj
          #       ↓
          # ThreeOneOSFive.xcodeproj
          #       ↓
          # repository root
          PROJECT_ROOT="$(dirname "$(dirname "$PROJECT_FILE")")"

          XCODEPROJ="$PROJECT_ROOT/ThreeOneOSFive.xcodeproj"

          if [ ! -d "$XCODEPROJ" ]; then
            echo "::error::Xcode project directory not found:"
            echo "$XCODEPROJ"
            exit 1
          fi

          if [ ! -f "$XCODEPROJ/project.pbxproj" ]; then
            echo "::error::project.pbxproj not found:"
            echo "$XCODEPROJ/project.pbxproj"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Xcode project:"
          echo "$XCODEPROJ"

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "SOURCE STRUCTURE"
          echo "========================================"

          test -d "$XCODEPROJ"
          test -f "$XCODEPROJ/project.pbxproj"

          echo ""
          echo "Root contents:"
          ls -la "$PROJECT_ROOT"

          echo ""
          echo "Checking ThreeOneOSFive..."

          if [ ! -d "$PROJECT_ROOT/ThreeOneOSFive" ]; then
            echo "::error::ThreeOneOSFive source directory not found."
            exit 1
          fi

          echo "ThreeOneOSFive: OK"

          echo ""
          echo "Checking tools..."

          if [ ! -d "$PROJECT_ROOT/tools" ]; then
            echo "::error::tools directory not found."
            exit 1
          fi

          echo "tools: OK"

          echo ""
          echo "Checking Patches..."

          if [ -d "$PROJECT_ROOT/ThreeOneOSFive/Patches" ]; then
            echo "Patches: OK"
          else
            echo "::error::ThreeOneOSFive/Patches not found."
            exit 1
          fi

          echo ""
          echo "Checking Generated..."

          if [ -d "$PROJECT_ROOT/ThreeOneOSFive/Generated" ]; then
            echo "Generated: OK"
          else
            echo "::error::ThreeOneOSFive/Generated not found."
            exit 1
          fi

          echo ""
          echo "Checking patch vault..."

          if [ -f "$PROJECT_ROOT/ThreeOneOSFive/Generated/patchvault.bin" ]; then
            echo "patchvault.bin: OK"
          else
            echo "::warning::patchvault.bin not found."
          fi

          echo ""
          echo "Checking resource vault..."

          if [ -f "$PROJECT_ROOT/ThreeOneOSFive/Generated/resourcevault.bin" ]; then
            echo "resourcevault.bin: OK"
          else
            echo "::warning::resourcevault.bin not found."
          fi

          echo ""
          echo "Checking patch builder..."

          if [ -f "$PROJECT_ROOT/tools/build_patch_vault.py" ]; then
            echo "build_patch_vault.py: OK"
          else
            echo "::warning::build_patch_vault.py not found."
          fi

      - name: Show patch resources
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PATCH RESOURCES"
          echo "========================================"

          PATCH_DIR="$PROJECT_ROOT/ThreeOneOSFive/Patches"
          GENERATED_DIR="$PROJECT_ROOT/ThreeOneOSFive/Generated"

          echo ""
          echo "Patches directory:"
          echo "$PATCH_DIR"

          echo ""
          echo "Files in Patches:"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

          echo ""
          echo "3105 patch files:"

          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -print \
            | sort || true

          echo ""
          echo "Generated directory:"
          echo "$GENERATED_DIR"

          echo ""
          echo "Generated files:"

          find "$GENERATED_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort || true

      - name: Validate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE PROJECT"
          echo "========================================"

          xcodebuild \
            -project "$XCODEPROJ" \
            -list

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p \
            "$GITHUB_WORKSPACE/build/DerivedData"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$XCODEPROJ" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      - name: Build 3105 External UI
        shell: bash
        run: |
          set -o pipefail

          LOG="$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD 3105 EXTERNAL UI"
          echo "========================================"

          xcodebuild \
            -project "$XCODEPROJ" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build \
            2>&1 | tee "$LOG"

          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            echo ""
            echo "Relevant errors:"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$LOG" \
              | tail -n 300 || true

            echo ""
            echo "Last 150 lines:"

            tail -n 150 "$LOG" || true

            exit "$RC"
          fi

          echo ""
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

      - name: Locate built application
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Release .app..."

          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name '*.app' \
            -path '*/Build/Products/Release-iphoneos/*' \
            -print \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "::error::No Release-iphoneos .app was produced."

            echo ""
            echo "Available .app files:"

            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -type d \
              -name '*.app' \
              -print || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo ""
          echo "Application:"
          echo "$APP"

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail

          test -d "$APP"
          test -f "$APP/Info.plist"

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$APP/Info.plist"
          )"

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )"

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo ""
          echo "Executable:"
          echo "$EXECUTABLE_NAME"

          EXECUTABLE="$APP/$EXECUTABLE_NAME"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::Application executable not found:"
            echo "$EXECUTABLE"
            exit 1
          fi

          echo ""
          echo "Executable:"
          file "$EXECUTABLE"

          echo ""
          echo "Architecture:"
          lipo -info "$EXECUTABLE" || true

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_NAME="3105-1.0.1-EXTERNAL-UI.ipa"

          echo "========================================"
          echo "PACKAGING IPA"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/Payload"

          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          rm -f "$IPA_NAME"

          /usr/bin/zip \
            -qry \
            "$IPA_NAME" \
            Payload

          if [ ! -s "$IPA_NAME" ]; then
            echo "::error::IPA was not created."
            exit 1
          fi

          echo ""
          echo "IPA successfully created:"

          ls -lh "$IPA_NAME"

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-1.0.1-EXTERNAL-UI
          path: 3105-1.0.1-EXTERNAL-UI.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-1.0.1-EXTERNAL-UI-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
