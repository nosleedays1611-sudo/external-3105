name: Build EXTERNAL 3105 2.0 IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

    paths:
      - "**/*.swift"
      - "**/*.m"
      - "**/*.c"
      - "**/*.h"
      - "**/*.plist"
      - "**/*.xcodeproj/**"
      - "**/*.xcassets/**"
      - "**/*.dylib"
      - "**/*.zip"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: external-3105-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    name: Build unsigned IPA

    runs-on: macos-15

    timeout-minutes: 35

    env:

      TARGET_NAME: "3105"

      CONFIGURATION: "Release"

      SDK: "iphoneos"

      SOURCE_DIR: "${{ github.workspace }}/source"

      BUILD_DIR: "${{ github.workspace }}/build"

      OUTPUT_DIR: "${{ github.workspace }}/output"

      IPA_NAME: "3105-2.0-EXTERNAL-REMOTE.ipa"

      EXTERNAL_REMOTE_CONFIG_URL: "${{ vars.EXTERNAL_REMOTE_CONFIG_URL }}"

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Show runner and Xcode
        shell: bash

        run: |

          set -euo pipefail

          echo "========================================"
          echo "RUNNER"
          echo "========================================"

          sw_vers

          echo ""
          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Xcode path:"
          xcode-select -p

          echo ""
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"


      - name: Locate and prepare source
        shell: bash

        run: |

          set -euo pipefail

          echo "========================================"
          echo "PREPARING SOURCE"
          echo "========================================"

          rm -rf "$SOURCE_DIR"
          rm -rf "$BUILD_DIR"
          rm -rf "$OUTPUT_DIR"

          mkdir -p "$SOURCE_DIR"
          mkdir -p "$BUILD_DIR"
          mkdir -p "$OUTPUT_DIR"


          echo ""
          echo "Checking if project is already unpacked..."

          DIRECT_PROJECT="$(find "$GITHUB_WORKSPACE" \
            -path '*/__MACOSX/*' -prune -o \
            -path '*/source/*' -prune -o \
            -path '*/build/*' -prune -o \
            -path '*/output/*' -prune -o \
            -name project.pbxproj \
            -path '*/ThreeOneOSFive.xcodeproj/project.pbxproj' \
            -print -quit)"


          if [[ -n "$DIRECT_PROJECT" ]]; then

            echo ""
            echo "Found unpacked Xcode project:"
            echo "$DIRECT_PROJECT"

            PROJECT_DIR="$(dirname "$(dirname "$DIRECT_PROJECT")")"

            echo ""
            echo "Project root:"
            echo "$PROJECT_DIR"

            ditto "$PROJECT_DIR" "$SOURCE_DIR"


          else

            echo ""
            echo "No unpacked project found."
            echo "Searching ZIP files..."


            SOURCE_ZIP="$(python3 - <<'PY'

          import os
          import zipfile

          root = os.environ["GITHUB_WORKSPACE"]

          candidates = []

          for base, dirs, files in os.walk(root):

              dirs[:] = [
                  directory
                  for directory in dirs
                  if directory not in {
                      ".git",
                      "__MACOSX",
                      "source",
                      "build",
                      "output",
                  }
              ]

              for filename in files:

                  if not filename.lower().endswith(".zip"):
                      continue

                  path = os.path.join(base, filename)

                  try:

                      with zipfile.ZipFile(path) as archive:

                          names = [
                              name
                              for name in archive.namelist()
                              if not name.startswith("__MACOSX/")
                          ]

                          contains_project = any(
                              name.endswith(
                                  "ThreeOneOSFive.xcodeproj/project.pbxproj"
                              )
                              for name in names
                          )

                          if contains_project:
                              candidates.append(path)

                  except zipfile.BadZipFile:
                      pass


          if not candidates:

              raise SystemExit(
                  "No ZIP containing "
                  "ThreeOneOSFive.xcodeproj/project.pbxproj "
                  "was found."
              )


          candidates.sort(
              key=lambda path: (
                  os.path.getmtime(path),
                  os.path.getsize(path),
              ),
              reverse=True,
          )


          print(candidates[0])

          PY
          )"


            echo ""
            echo "Using source ZIP:"
            echo "$SOURCE_ZIP"


            TEMP_EXTRACT="$RUNNER_TEMP/external-source"

            rm -rf "$TEMP_EXTRACT"

            mkdir -p "$TEMP_EXTRACT"


            echo ""
            echo "Extracting..."

            ditto -x -k "$SOURCE_ZIP" "$TEMP_EXTRACT"


            echo ""
            echo "Locating project after extraction..."

            PBXPROJ="$(find "$TEMP_EXTRACT" \
              -path '*/__MACOSX/*' -prune -o \
              -name project.pbxproj \
              -path '*/ThreeOneOSFive.xcodeproj/project.pbxproj' \
              -print -quit)"


            if [[ -z "$PBXPROJ" ]]; then

              echo ""
              echo "ERROR:"
              echo "project.pbxproj was not found after extraction."

              find "$TEMP_EXTRACT" -maxdepth 5 -print

              exit 1

            fi


            PROJECT_DIR="$(dirname "$(dirname "$PBXPROJ")")"


            echo ""
            echo "Extracted project root:"
            echo "$PROJECT_DIR"


            ditto "$PROJECT_DIR" "$SOURCE_DIR"

          fi


          PROJECT="$SOURCE_DIR/ThreeOneOSFive.xcodeproj"

          PBXPROJ="$PROJECT/project.pbxproj"

          INFO_PLIST="$SOURCE_DIR/ThreeOneOSFive/Info.plist"

          AUTH_DYLIB="$SOURCE_DIR/ThreeOneOSFive/Auth/ExternalAuth.dylib"


          echo ""
          echo "========================================"
          echo "VALIDATING REQUIRED FILES"
          echo "========================================"


          if [[ ! -f "$PBXPROJ" ]]; then

            echo "ERROR: Missing:"
            echo "$PBXPROJ"

            exit 1

          fi


          if [[ ! -f "$INFO_PLIST" ]]; then

            echo "ERROR: Missing:"
            echo "$INFO_PLIST"

            exit 1

          fi


          if [[ ! -f "$AUTH_DYLIB" ]]; then

            echo "ERROR: Missing:"
            echo "$AUTH_DYLIB"

            exit 1

          fi


          echo ""
          echo "All required files found."


          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "PBXPROJ=$PBXPROJ" >> "$GITHUB_ENV"

          echo "INFO_PLIST=$INFO_PLIST" >> "$GITHUB_ENV"


          echo ""
          echo "Prepared source files:"

          find "$SOURCE_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100


      - name: Validate Xcode project
        shell: bash

        run: |

          set -euo pipefail

          echo "========================================"
          echo "PROJECT VALIDATION"
          echo "========================================"

          plutil -lint "$PBXPROJ"


          echo ""
          echo "Available targets/configurations:"

          xcodebuild \
            -project "$PROJECT" \
            -list


      - name: Validate ExternalAuth
        shell: bash

        run: |

          set -euo pipefail

          AUTH_DYLIB="$SOURCE_DIR/ThreeOneOSFive/Auth/ExternalAuth.dylib"


          echo "========================================"
          echo "EXTERNAL AUTH VALIDATION"
          echo "========================================"


          file "$AUTH_DYLIB"


          if ! file "$AUTH_DYLIB" | grep -q "arm64"; then

            echo ""
            echo "ERROR:"
            echo "ExternalAuth.dylib is not arm64."

            exit 1

          fi


          echo ""
          echo "ExternalAuth SHA-256:"

          shasum -a 256 "$AUTH_DYLIB"


      - name: Inject Remote Config URL
        if: ${{ env.EXTERNAL_REMOTE_CONFIG_URL != '' }}

        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "REMOTE CONFIG URL"
          echo "========================================"


          /usr/libexec/PlistBuddy \
            -c "Set :ExternalRemoteConfigURL $EXTERNAL_REMOTE_CONFIG_URL" \
            "$INFO_PLIST" \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :ExternalRemoteConfigURL string $EXTERNAL_REMOTE_CONFIG_URL" \
            "$INFO_PLIST"


          echo ""
          echo "Injected URL:"


          /usr/libexec/PlistBuddy \
            -c "Print :ExternalRemoteConfigURL" \
            "$INFO_PLIST"


      - name: Show final build configuration
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "BUILD SETTINGS"
          echo "========================================"


          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SDKROOT|ARCHS|SWIFT_VERSION" \
            || true


      - name: Build EXTERNAL
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "BUILDING EXTERNAL"
          echo "========================================"


          cd "$SOURCE_DIR"


          set +e


          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SYMROOT="$BUILD_DIR" \
            OBJROOT="$BUILD_DIR/obj" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 \
            | tee "$OUTPUT_DIR/xcodebuild.log"


          STATUS=${PIPESTATUS[0]}


          set -e


          echo ""
          echo "xcodebuild exit code:"
          echo "$STATUS"


          if [[ "$STATUS" -ne 0 ]]; then

            echo ""
            echo "========================================"
            echo "BUILD FAILED"
            echo "========================================"

            exit "$STATUS"

          fi


          echo ""
          echo "========================================"
          echo "BUILD SUCCEEDED"
          echo "========================================"


      - name: Locate built application
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "LOCATING 3105.APP"
          echo "========================================"


          APP_PATH="$(find "$BUILD_DIR" \
            -type d \
            -name '3105.app' \
            -path '*Release-iphoneos*' \
            -print \
            -quit)"


          if [[ -z "$APP_PATH" ]]; then

            APP_PATH="$(find "$BUILD_DIR" \
              -type d \
              -name '3105.app' \
              -print \
              -quit)"

          fi


          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then

            echo ""
            echo "ERROR:"
            echo "3105.app was not generated."

            echo ""
            echo "Build directory contents:"

            find "$BUILD_DIR" \
              -maxdepth 6 \
              -print \
              || true

            exit 1

          fi


          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"


          echo ""
          echo "Built application:"

          echo "$APP_PATH"


          echo ""
          echo "Size:"

          du -sh "$APP_PATH"


      - name: Validate built application
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "VALIDATING BUILT APP"
          echo "========================================"


          APP_EXECUTABLE="$APP_PATH/3105"

          AUTH_DYLIB="$APP_PATH/Frameworks/ExternalAuth.dylib"


          if [[ ! -f "$APP_EXECUTABLE" ]]; then

            echo "ERROR:"
            echo "Main executable not found."

            exit 1

          fi


          if [[ ! -f "$APP_PATH/Info.plist" ]]; then

            echo "ERROR:"
            echo "Built Info.plist not found."

            exit 1

          fi


          if [[ ! -f "$AUTH_DYLIB" ]]; then

            echo "ERROR:"
            echo "ExternalAuth.dylib was not embedded."

            exit 1

          fi


          echo ""
          echo "Info.plist validation:"

          plutil -lint "$APP_PATH/Info.plist"


          echo ""
          echo "Main executable:"

          file "$APP_EXECUTABLE"


          echo ""
          echo "ExternalAuth:"

          file "$AUTH_DYLIB"


          echo ""
          echo "Main executable dependencies:"

          otool -L "$APP_EXECUTABLE"


          if ! otool -L "$APP_EXECUTABLE" \
            | grep -q "ExternalAuth.dylib"; then

            echo ""
            echo "ERROR:"
            echo "3105 executable is not linked to ExternalAuth.dylib."

            exit 1

          fi


          echo ""
          echo "Bundle Identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"


          echo ""
          echo "Display Name:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist"


          echo ""
          echo "Minimum OS:"

          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$APP_PATH/Info.plist" \
            || true


          echo ""
          echo "Remote Config URL:"

          /usr/libexec/PlistBuddy \
            -c "Print :ExternalRemoteConfigURL" \
            "$APP_PATH/Info.plist" \
            || true


      - name: Package unsigned IPA
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "PACKAGING IPA"
          echo "========================================"


          PACKAGE_ROOT="$RUNNER_TEMP/ipa-root"


          rm -rf "$PACKAGE_ROOT"


          mkdir -p "$PACKAGE_ROOT/Payload"


          echo ""
          echo "Copying application..."


          ditto \
            "$APP_PATH" \
            "$PACKAGE_ROOT/Payload/3105.app"


          echo ""
          echo "Removing stale signatures..."


          codesign \
            --remove-signature \
            "$PACKAGE_ROOT/Payload/3105.app/Frameworks/ExternalAuth.dylib" \
            2>/dev/null \
            || true


          codesign \
            --remove-signature \
            "$PACKAGE_ROOT/Payload/3105.app" \
            2>/dev/null \
            || true


          rm -rf \
            "$PACKAGE_ROOT/Payload/3105.app/_CodeSignature"


          rm -f \
            "$PACKAGE_ROOT/Payload/3105.app/embedded.mobileprovision"


          echo ""
          echo "Creating unsigned IPA..."


          cd "$PACKAGE_ROOT"


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$OUTPUT_DIR/$IPA_NAME"


          if [[ ! -s "$OUTPUT_DIR/$IPA_NAME" ]]; then

            echo ""
            echo "ERROR:"
            echo "IPA was not created."

            exit 1

          fi


          echo ""
          echo "Generated IPA:"

          ls -lh "$OUTPUT_DIR/$IPA_NAME"


      - name: Validate IPA
        shell: bash

        run: |

          set -euo pipefail


          echo "========================================"
          echo "IPA VALIDATION"
          echo "========================================"


          IPA="$OUTPUT_DIR/$IPA_NAME"


          test -s "$IPA"


          echo ""
          echo "IPA contents:"

          unzip -l "$IPA" \
            | head -80


          echo ""
          echo "Checking required application files..."


          if ! unzip -l "$IPA" \
            | grep -q "Payload/3105.app/3105"; then

            echo ""
            echo "ERROR:"
            echo "Main executable missing from IPA."

            exit 1

          fi


          if ! unzip -l "$IPA" \
            | grep -q "Payload/3105.app/Frameworks/ExternalAuth.dylib"; then

            echo ""
            echo "ERROR:"
            echo "ExternalAuth.dylib missing from IPA."

            exit 1

          fi


          echo ""
          echo "IPA SHA-256:"

          shasum -a 256 "$IPA"


      - name: Generate build metadata
        if: always()

        shell: bash

        run: |

          set -uo pipefail


          mkdir -p "$OUTPUT_DIR"


          {

            echo "workflow=$GITHUB_WORKFLOW"

            echo "run_id=$GITHUB_RUN_ID"

            echo "run_number=$GITHUB_RUN_NUMBER"

            echo "commit=$GITHUB_SHA"

            echo "ref=$GITHUB_REF"

            echo "runner=$(sw_vers -productVersion 2>/dev/null || true)"

            echo "xcode=$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"


            if [[ -n "${APP_PATH:-}" ]] \
              && [[ -f "${APP_PATH}/3105" ]]; then

              echo "binary=$(file "${APP_PATH}/3105")"

            fi


            if [[ -f "$OUTPUT_DIR/$IPA_NAME" ]]; then

              echo "ipa_sha256=$(shasum -a 256 "$OUTPUT_DIR/$IPA_NAME" | awk '{print $1}')"

            fi

          } > "$OUTPUT_DIR/build-info.txt"


          echo ""
          echo "========================================"
          echo "BUILD INFO"
          echo "========================================"


          cat "$OUTPUT_DIR/build-info.txt"


      - name: Upload IPA
        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: 3105-2.0-EXTERNAL-REMOTE-IPA

          path: ${{ env.OUTPUT_DIR }}/${{ env.IPA_NAME }}

          if-no-files-found: error

          compression-level: 0

          retention-days: 30


      - name: Upload build log
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: 3105-2.0-EXTERNAL-REMOTE-build-log

          path: |

            ${{ env.OUTPUT_DIR }}/xcodebuild.log

            ${{ env.OUTPUT_DIR }}/build-info.txt

          if-no-files-found: warn

          retention-days: 14
