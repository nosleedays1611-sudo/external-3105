name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and prepare source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf source build Payload
          mkdir -p source

          echo "========================================"
          echo "PROCURANDO SOURCE"
          echo "========================================"

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do
            echo "Verificando: $ZIP"

            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
          )

          if [ -n "$SOURCE_ZIP" ]; then
            echo
            echo "Source encontrada:"
            echo "$SOURCE_ZIP"

            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source"

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            echo
            echo "Nenhum ZIP com projeto encontrado."
            echo "Procurando projeto já extraído..."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            -print \
            -quit)"

          if [ -z "$PROJECT" ]; then
            echo
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -print | head -n 400
            exit 1
          fi

          ROOT="$(dirname "$PROJECT")"
          PATCHES_DIR="$ROOT/ThreeOneOSFive/Patches"
          VAULT="$ROOT/ThreeOneOSFive/Generated/patchvault.bin"
          RESOURCE_VAULT="$ROOT/ThreeOneOSFive/Generated/resourcevault.bin"
          PATCH_BRIDGE="$ROOT/ThreeOneOSFive/helpers/PatchVaultBridge.generated.c"
          AUTH="$ROOT/ThreeOneOSFive/Auth/CanvaCore.dylib"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PATCHES_DIR=$PATCHES_DIR" >> "$GITHUB_ENV"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "RESOURCE_VAULT=$RESOURCE_VAULT" >> "$GITHUB_ENV"
          echo "PATCH_BRIDGE=$PATCH_BRIDGE" >> "$GITHUB_ENV"
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "PROJETO ENCONTRADO"
          echo "========================================"
          echo "$PROJECT"
          echo "ROOT: $ROOT"

          mkdir -p "$PATCHES_DIR"
          mkdir -p "$ROOT/ThreeOneOSFive/Generated"

          if [ ! -s "$RESOURCE_VAULT" ]; then
            echo "ERRO: resourcevault.bin não encontrado."
            exit 1
          fi

          if [ ! -s "$AUTH" ]; then
            echo "ERRO: CanvaCore.dylib não encontrada."
            exit 1
          fi

          if [ ! -f "$VAULT_GENERATOR" ]; then
            echo "ERRO: tools/build_patch_vault.py não encontrado."
            exit 1
          fi

          echo
          echo "========================================"
          echo "NORMALIZANDO NOMES .3105"
          echo "========================================"

          while IFS= read -r -d '' FILE; do
            DEST="${FILE%.3105}"

            if [ -e "$DEST" ]; then
              echo "ERRO: não posso renomear porque já existe: $DEST"
              exit 1
            fi

            echo "Renomeando:"
            echo "  $FILE"
            echo "  -> $DEST"
            mv "$FILE" "$DEST"
          done < <(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105.3105' \
              -print0
          )

          PATCH_COUNT="$(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo ".3105 encontrados para integração: $PATCH_COUNT"

          if [ "$PATCH_COUNT" -gt 0 ]; then
            echo
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -print

            echo
            echo "========================================"
            echo "GERANDO PATCH VAULT"
            echo "========================================"

            python3 -m pip install -q cryptography

            python3 "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"

            if [ ! -s "$VAULT" ]; then
              echo "ERRO: patchvault.bin não foi gerado."
              exit 1
            fi

            if [ ! -s "$PATCH_BRIDGE" ]; then
              echo "ERRO: PatchVaultBridge.generated.c não foi gerado."
              exit 1
            fi

            echo
            echo "Vault gerado:"
            ls -lh "$VAULT"

            echo
            echo "Bridge gerado:"
            ls -lh "$PATCH_BRIDGE"

            echo
            echo "Removendo .3105 crus somente após gerar o vault..."

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete
          else
            echo "Nenhum .3105 novo encontrado."
            echo "Usando patchvault.bin existente."

            if [ ! -s "$VAULT" ]; then
              echo "ERRO: patchvault.bin não encontrado."
              exit 1
            fi

            if [ ! -s "$PATCH_BRIDGE" ]; then
              echo "ERRO: PatchVaultBridge.generated.c não encontrado."
              exit 1
            fi
          fi

          echo
          echo "========================================"
          echo "VALIDANDO SOURCE"
          echo "========================================"

          RAW_PATCH_COUNT="$(
            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          echo ".3105 crus restantes: $RAW_PATCH_COUNT"

          if [ "$RAW_PATCH_COUNT" -ne 0 ]; then
            echo "ERRO: ainda existem .3105 crus depois da integração."
            find "$ROOT/ThreeOneOSFive" -type f -name '*.3105' -print
            exit 1
          fi

          echo
          echo "Patch vault:"
          ls -lh "$VAULT"

          echo
          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

          echo
          echo "Auth:"
          ls -lh "$AUTH"

          echo
          echo "SOURCE PREPARADA COM SUCESSO."

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD MAX HARDENED"
          echo "========================================"
          echo "$PROJECT"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}
          set -e

          echo
          echo "xcodebuild exit code: $RC"

          if [ "$RC" -ne 0 ]; then
            echo
            echo "========================================"
            echo "BUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 200 || true

            exit "$RC"
          fi

          echo
          echo "BUILD CONCLUÍDO."

      - name: Harden and package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERRO: 3105.app não encontrado."
            exit 1
          fi

          EXE="$APP/3105"

          if [ ! -f "$EXE" ]; then
            echo "ERRO: executável 3105 não encontrado."
            exit 1
          fi

          echo "========================================"
          echo "APP ENCONTRADO"
          echo "========================================"
          echo "$APP"

          echo
          echo "Executável:"
          ls -lh "$EXE"

          echo
          echo "========================================"
          echo "VALIDANDO VAULTS NO MACH-O"
          echo "========================================"

          if ! otool -l "$EXE" | grep -q 'sectname __pv3105'; then
            echo "ERRO: __pv3105 não encontrado."
            exit 1
          fi

          echo "__pv3105 OK"

          if ! otool -l "$EXE" | grep -q 'sectname __rv3105'; then
            echo "ERRO: __rv3105 não encontrado."
            exit 1
          fi

          echo "__rv3105 OK"

          echo
          echo "Removendo símbolos locais/debug..."
          strip -S -x "$EXE" || true

          echo
          echo "Removendo recursos desnecessários..."
          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

          find "$APP" \
            -maxdepth 1 \
            -type d \
            -name '*.lproj' \
            -exec rm -rf {} +

          RAW_APP="$(
            find "$APP" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          echo ".3105 crus no app: $RAW_APP"

          if [ "$RAW_APP" -ne 0 ]; then
            echo "ERRO: .3105 cru encontrado no app."
            find "$APP" -type f -name '*.3105' -print
            exit 1
          fi

          LPROJ_COUNT="$(
            find "$APP" \
              -type d \
              -name '*.lproj' \
              | wc -l \
              | tr -d ' '
          )"

          echo ".lproj no app: $LPROJ_COUNT"

          if [ "$LPROJ_COUNT" -ne 0 ]; then
            echo "ERRO: .lproj ainda presente."
            exit 1
          fi

          if [ ! -f "$APP/Frameworks/CanvaCore.dylib" ]; then
            echo "ERRO: CanvaCore.dylib ausente no app."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/3105.app

          IPA="3105-EXTERNAL-UI-1.0.1-MAX-HARDENED-unsigned.ipa"
          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          echo
          echo "========================================"
          echo "VALIDANDO IPA FINAL"
          echo "========================================"

          RAW_IPA="$(unzip -l "$IPA" | grep -c '\.3105$' || true)"
          echo ".3105 crus na IPA: $RAW_IPA"

          if [ "$RAW_IPA" -ne 0 ]; then
            echo "ERRO: .3105 cru encontrado na IPA."
            exit 1
          fi

          LPROJ_IPA="$(unzip -l "$IPA" | grep -c '\.lproj/' || true)"
          echo ".lproj na IPA: $LPROJ_IPA"

          if [ "$LPROJ_IPA" -ne 0 ]; then
            echo "ERRO: .lproj encontrado na IPA."
            exit 1
          fi

          echo
          echo "========================================"
          echo "IPA MAX HARDENED CRIADA"
          echo "========================================"

          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-MAX-HARDENED-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-MAX-HARDENED-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-max-hardened-log
          path: xcodebuild.log
          if-no-files-found: ignore
