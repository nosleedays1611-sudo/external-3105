name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source build Payload
          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name '*MAX-HARDENED-source.zip' -o -name '*PROTECTED-source.zip' | head -n 1 || true)

          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d source
            SEARCH="$GITHUB_WORKSPACE/source"
          else
            SEARCH="$GITHUB_WORKSPACE"
          fi

          PROJECT=$(find "$SEARCH" -type d -name 'ThreeOneOSFive.xcodeproj' -print -quit)

          [ -n "$PROJECT" ] || {
            echo 'ERRO: projeto não encontrado'
            exit 1
          }

          ROOT=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          test -s "$ROOT/ThreeOneOSFive/Generated/patchvault.bin"
          test -s "$ROOT/ThreeOneOSFive/Generated/resourcevault.bin"
          test -s "$ROOT/ThreeOneOSFive/Auth/CanvaCore.dylib"

          RAW=$(find "$ROOT/ThreeOneOSFive" \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')

          [ "$RAW" -eq 0 ] || {
            echo 'ERRO: .3105 cru na source'
            exit 1
          }

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          [ "$RC" -eq 0 ] || exit "$RC"

      - name: Harden and package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)

          [ -n "$APP" ] || {
            echo 'ERRO: app não encontrado'
            exit 1
          }

          EXE="$APP/3105"

          otool -l "$EXE" | grep -q 'sectname __pv3105'
          otool -l "$EXE" | grep -q 'sectname __rv3105'

          strip -S -x "$EXE" || true

          rm -rf \
            "$APP"/*.lproj \
            "$APP"/Patches \
            "$APP"/PkgInfo

          find "$APP" \
            -type f \
            -name '*.3105' \
            -print -quit \
            | grep -q . && {
              echo 'ERRO: .3105 cru no app'
              exit 1
            } || true

          find "$APP" \
            -type d \
            -name '*.lproj' \
            -print -quit \
            | grep -q . && {
              echo 'ERRO: lproj no app'
              exit 1
            } || true

          test -f "$APP/Frameworks/CanvaCore.dylib"

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/3105.app

          IPA='3105-EXTERNAL-UI-1.0.1-MAX-HARDENED-unsigned.ipa'

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          unzip -l "$IPA" \
            | grep -q '\.3105$' && {
              echo 'ERRO: .3105 cru na IPA'
              exit 1
            } || true

          unzip -l "$IPA" \
            | grep -q '\.lproj/' && {
              echo 'ERRO: lproj na IPA'
              exit 1
            } || true

          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-MAX-HARDENED-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-MAX-HARDENED-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-max-hardened-log
          path: xcodebuild.log
          if-no-files-found: ignore
