name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source 1.0.1
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="3105-1.0.1-EXTERNAL-UI-source.zip"

          rm -rf source build Payload
          mkdir -p source

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERRO: $SOURCE_ZIP não encontrado."
            echo "Arquivos disponíveis:"
            ls -lah
            exit 1
          fi

          echo "Extraindo: $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d source

          PROJECT="$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -print
            exit 1
          fi

          PATCHES_DIR="$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -path '*/ThreeOneOSFive/Patches' \
            -print -quit)"

          if [ -z "$PATCHES_DIR" ]; then
            echo "ERRO: pasta ThreeOneOSFive/Patches não encontrada."
            echo "Pastas Patches encontradas:"
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name 'Patches' \
              -print || true
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PATCHES_DIR=$PATCHES_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJETO"
          echo "$PROJECT"
          echo
          echo "PASTA DE PATCHES"
          echo "$PATCHES_DIR"
          echo "========================================"

          echo
          echo "Arquivos .3105 encontrados:"

          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -print

          PATCH_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l | tr -d ' ')"

          echo
          echo "Total de patches: $PATCH_COUNT"

          if [ "$PATCH_COUNT" -eq 0 ]; then
            echo "ERRO: a pasta Patches existe, mas não contém nenhum .3105."
            exit 1
          fi

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD 3105 1.0.1"
          echo "Projeto: $PROJECT"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "xcodebuild exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "BUILD FALHOU."

            grep -n -E \
              "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 150 || true

            exit "$BUILD_EXIT"
          fi

          echo
          echo "BUILD CONCLUÍDO."

      - name: Package IPA with patches
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERRO: 3105.app não encontrado."
            exit 1
          fi

          echo "App encontrado:"
          echo "$APP_PATH"

          echo
          echo "Patches serão copiados de:"
          echo "$PATCHES_DIR"

          SOURCE_PATCH_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l | tr -d ' ')"

          if [ "$SOURCE_PATCH_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum .3105 encontrado antes do empacotamento."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          # ================================================
          # COLOCA OS PATCHES DENTRO DO APP
          # ================================================

          mkdir -p Payload/3105.app/Patches

          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -exec cp -v {} Payload/3105.app/Patches/ \;

          echo
          echo "========================================"
          echo "PATCHES COPIADOS PARA 3105.app"
          echo "========================================"

          find Payload/3105.app/Patches \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -print

          APP_PATCH_COUNT="$(find Payload/3105.app/Patches \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l | tr -d ' ')"

          echo
          echo "Source: $SOURCE_PATCH_COUNT patch(es)"
          echo "App:    $APP_PATCH_COUNT patch(es)"

          if [ "$APP_PATCH_COUNT" -ne "$SOURCE_PATCH_COUNT" ]; then
            echo "ERRO: quantidade de patches dentro do app não confere."
            exit 1
          fi

          echo
          echo "Tamanho do app:"
          du -sh Payload/3105.app

          echo
          echo "Tamanho da pasta Patches:"
          du -sh Payload/3105.app/Patches

          # ================================================
          # CRIA IPA
          # ================================================

          rm -f 3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          echo
          echo "========================================"
          echo "IPA CRIADA"
          echo "========================================"

          ls -lh 3105-EXTERNAL-UI-1.0.1-unsigned.ipa

          # ================================================
          # CONFIRMA OS PATCHES DENTRO DA IPA FINAL
          # ================================================

          echo
          echo "Patches encontrados dentro da IPA:"

          unzip -l \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa \
            | grep '\.3105$' || true

          IPA_PATCH_COUNT="$(unzip -l \
            3105-EXTERNAL-UI-1.0.1-unsigned.ipa \
            | grep -c '\.3105$' || true)"

          echo
          echo "Source: $SOURCE_PATCH_COUNT"
          echo "App:    $APP_PATCH_COUNT"
          echo "IPA:    $IPA_PATCH_COUNT"

          if [ "$IPA_PATCH_COUNT" -ne "$SOURCE_PATCH_COUNT" ]; then
            echo "ERRO: patches ausentes na IPA final."
            exit 1
          fi

          echo
          echo "========================================"
          echo "IPA VALIDADA"
          echo "$IPA_PATCH_COUNT patch(es) incluído(s)"
          echo "========================================"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-EXTERNAL-UI-1.0.1-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-1.0.1-log
          path: xcodebuild.log
          if-no-files-found: ignore
