name: Build 3105 External UI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-3105-external-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(find /Applications \
            -maxdepth 1 \
            -type d \
            -name 'Xcode*.app' \
            -print \
            | sort -V \
            | tail -n 1)"

          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found."
            exit 1
          fi

          echo "Using: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Locate ThreeOneOSFive project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path '*/ThreeOneOSFive.xcodeproj/project.pbxproj' \
            -print \
            -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::ThreeOneOSFive.xcodeproj not found."

            echo "Available Xcode projects:"
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name '*.xcodeproj' \
              -print || true

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          PROJECT="$PROJECT_ROOT/ThreeOneOSFive.xcodeproj"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "XCODEPROJ=$PROJECT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail

          test -d "$XCODEPROJ"
          test -f "$XCODEPROJ/project.pbxproj"

          echo "=== Source root ==="
          find "$PROJECT_ROOT" \
            -maxdepth 2 \
            -type d \
            -print \
            | sort

          echo "=== Important directories ==="

          if [ -d "$PROJECT_ROOT/Patches" ]; then
            echo "Patches: OK"
          elif [ -d "$PROJECT_ROOT/ThreeOneOSFive/Patches" ]; then
            echo "ThreeOneOSFive/Patches: OK"
          else
            echo "::warning::Patches directory was not found."
          fi

          if [ -d "$PROJECT_ROOT/Generated" ]; then
            echo "Generated: OK"
          elif [ -d "$PROJECT_ROOT/ThreeOneOSFive/Generated" ]; then
            echo "ThreeOneOSFive/Generated: OK"
          else
            echo "::warning::Generated directory was not found."
          fi

          if [ -d "$PROJECT_ROOT/tools" ]; then
            echo "tools: OK"
          elif [ -d "$GITHUB_WORKSPACE/tools" ]; then
            echo "root tools: OK"
          else
            echo "::warning::tools directory was not found."
          fi

      - name: Show patch resources
        shell: bash
        run: |
          set -euo pipefail

          echo "=== .3105 files ==="

          find "$PROJECT_ROOT" \
            -type f \
            -name '*.3105' \
            -print \
            | sort || true

          echo "=== Generated resources ==="

          find "$PROJECT_ROOT" \
            -type f \
            \( \
              -name 'patchvault.bin' \
              -o -name 'resourcevault.bin' \
            \) \
            -print \
            | sort || true

      - name: List Xcode targets
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$XCODEPROJ" \
            -list

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$XCODEPROJ" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            clean

      - name: Build 3105 External UI
        shell: bash
        run: |
          set -o pipefail

          LOG="$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$XCODEPROJ" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build \
            2>&1 | tee "$LOG"

          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "XCODE BUILD FAILED"
            echo "========================================"

            echo ""
            echo "Relevant errors:"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$LOG" \
              | tail -n 300 || true

            echo ""
            echo "Last 150 lines:"

            tail -n 150 "$LOG" || true

            exit "$RC"
          fi

      - name: Locate built application
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name '*.app' \
            -path '*/Build/Products/Release-iphoneos/*' \
            -print \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "::error::No Release-iphoneos .app was produced."

            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -type d \
              -name '*.app' \
              -print || true

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "Built application:"
          echo "$APP"

      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail

          test -d "$APP"
          test -f "$APP/Info.plist"

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$APP/Info.plist"
          )"

          EXECUTABLE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE_NAME"

          EXECUTABLE="$APP/$EXECUTABLE_NAME"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::Executable not found:"
            echo "$EXECUTABLE"
            exit 1
          fi

          echo "Executable information:"
          file "$EXECUTABLE"

          echo "Architecture:"
          lipo -info "$EXECUTABLE" || true

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_NAME="3105-1.0.1-EXTERNAL-UI.ipa"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R "$APP" \
            "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          rm -f "$IPA_NAME"

          /usr/bin/zip \
            -qry \
            "$IPA_NAME" \
            Payload

          if [ ! -s "$IPA_NAME" ]; then
            echo "::error::IPA was not created."
            exit 1
          fi

          echo "IPA successfully created:"
          ls -lh "$IPA_NAME"

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-1.0.1-EXTERNAL-UI
          path: 3105-1.0.1-EXTERNAL-UI.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-1.0.1-EXTERNAL-UI-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
