name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # LOCALIZAR / EXTRAIR SOURCE
      # ============================================================

      - name: Extract and prepare source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf source build Payload
          mkdir -p source

          echo "========================================"
          echo "PROCURANDO SOURCE"
          echo "========================================"

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do

            echo "Verificando: $ZIP"

            # Ignora ZIPs gerados dentro de pastas de build/source.
            case "$ZIP" in
              "$GITHUB_WORKSPACE/source/"*)
                continue
                ;;
              "$GITHUB_WORKSPACE/build/"*)
                continue
                ;;
            esac

            # Procura o projeto real e ignora entradas __MACOSX.
            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -vE '(^|/)__MACOSX/' \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then

              SOURCE_ZIP="$ZIP"
              break
            fi

          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
          )

          if [ -n "$SOURCE_ZIP" ]; then

            echo
            echo "Source encontrada:"
            echo "$SOURCE_ZIP"

            # IMPORTANTE:
            # não extrair lixo criado pelo macOS.
            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source" \
              -x "__MACOSX/*" "*/__MACOSX/*"

            # Segurança adicional caso algum ZIP tenha estrutura estranha.
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name '__MACOSX' \
              -prune \
              -exec rm -rf {} + 2>/dev/null || true

            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name '._*' \
              -delete 2>/dev/null || true

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"

          else

            echo
            echo "Nenhum ZIP com projeto encontrado."
            echo "Procurando projeto já extraído..."

            SEARCH_ROOT="$GITHUB_WORKSPACE"

          fi


          # ========================================================
          # LOCALIZAR PROJETO
          # ========================================================

          PROJECT="$(
            find "$SEARCH_ROOT" \
              -type d \
              -name 'ThreeOneOSFive.xcodeproj' \
              ! -path '*/__MACOSX/*' \
              ! -path '*/build/*' \
              -print \
              -quit
          )"

          if [ -z "$PROJECT" ]; then

            echo
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            echo

            echo "Arquivos encontrados:"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              ! -path '*/__MACOSX/*' \
              -print \
              | head -n 500

            exit 1
          fi


          ROOT="$(dirname "$PROJECT")"

          PATCHES_DIR="$ROOT/ThreeOneOSFive/Patches"

          GENERATED_DIR="$ROOT/ThreeOneOSFive/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"

          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$ROOT/ThreeOneOSFive/helpers/PatchVaultBridge.generated.c"

          AUTH="$ROOT/ThreeOneOSFive/Auth/ExternalAuth.dylib"

          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"


          # ========================================================
          # EXPORTAR VARIÁVEIS PARA AS PRÓXIMAS ETAPAS
          # ========================================================

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PATCHES_DIR=$PATCHES_DIR" >> "$GITHUB_ENV"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "RESOURCE_VAULT=$RESOURCE_VAULT" >> "$GITHUB_ENV"
          echo "PATCH_BRIDGE=$PATCH_BRIDGE" >> "$GITHUB_ENV"
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"


          echo
          echo "========================================"
          echo "PROJETO ENCONTRADO"
          echo "========================================"

          echo "$PROJECT"

          echo
          echo "ROOT:"
          echo "$ROOT"

          echo
          echo "PATCHES:"
          echo "$PATCHES_DIR"

          echo
          echo "AUTH:"
          echo "$AUTH"


          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"
          mkdir -p "$(dirname "$PATCH_BRIDGE")"


          # ========================================================
          # VALIDAR ARQUIVOS DA SOURCE
          # ========================================================

          echo
          echo "========================================"
          echo "VALIDANDO ARQUIVOS BASE"
          echo "========================================"


          if [ ! -s "$RESOURCE_VAULT" ]; then

            echo "ERRO: resourcevault.bin não encontrado."
            echo
            echo "Esperado em:"
            echo "$RESOURCE_VAULT"

            exit 1
          fi


          if [ ! -s "$AUTH" ]; then

            echo "ERRO: ExternalAuth.dylib não encontrada."
            echo
            echo "Esperado em:"
            echo "$AUTH"

            exit 1
          fi


          if [ ! -f "$VAULT_GENERATOR" ]; then

            echo "ERRO: build_patch_vault.py não encontrado:"
            echo "$VAULT_GENERATOR"

            exit 1
          fi


          echo
          echo "resourcevault.bin:"
          ls -lh "$RESOURCE_VAULT"

          echo
          echo "ExternalAuth.dylib:"
          ls -lh "$AUTH"

          echo
          echo "Tipo da dylib:"
          file "$AUTH"

          echo
          echo "Dependências da dylib:"
          otool -L "$AUTH" || true

          echo
          echo "Gerador:"
          ls -lh "$VAULT_GENERATOR"


          # ========================================================
          # NORMALIZAR NOMES .3105.3105
          # ========================================================

          echo
          echo "========================================"
          echo "NORMALIZANDO NOMES DOS PATCHES"
          echo "========================================"

          while IFS= read -r -d '' FILE; do

            DEST="${FILE%.3105}"

            if [ -e "$DEST" ]; then

              echo
              echo "ERRO: destino já existe:"
              echo "$DEST"

              exit 1
            fi

            echo
            echo "Renomeando:"
            echo "$FILE"
            echo "->"
            echo "$DEST"

            mv "$FILE" "$DEST"

          done < <(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105.3105' \
              -print0
          )


          # ========================================================
          # CONTAR PATCHES NOVOS
          # ========================================================

          PATCH_COUNT="$(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"


          echo
          echo "========================================"
          echo "PATCHES ENCONTRADOS"
          echo "========================================"

          echo "Quantidade: $PATCH_COUNT"


          if [ "$PATCH_COUNT" -gt 0 ]; then

            echo
            echo "Patches novos:"

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -print


            # ======================================================
            # PYTHON VENV
            # ======================================================

            echo
            echo "========================================"
            echo "PREPARANDO PYTHON"
            echo "========================================"

            PYTHON_VENV="$RUNNER_TEMP/patchvault-venv"

            rm -rf "$PYTHON_VENV"

            echo "Criando ambiente virtual..."

            python3 -m venv "$PYTHON_VENV"


            echo
            echo "Python utilizado:"

            "$PYTHON_VENV/bin/python" --version


            echo
            echo "Atualizando pip..."

            "$PYTHON_VENV/bin/python" \
              -m pip install \
              --upgrade pip


            echo
            echo "Instalando cryptography..."

            "$PYTHON_VENV/bin/python" \
              -m pip install \
              cryptography


            # ======================================================
            # GERAR/MERGE PATCH VAULT
            # ======================================================

            echo
            echo "========================================"
            echo "GERANDO PATCH VAULT"
            echo "========================================"

            "$PYTHON_VENV/bin/python" \
              "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"


            # ======================================================
            # VALIDAR VAULT
            # ======================================================

            echo
            echo "========================================"
            echo "VALIDANDO VAULT GERADO"
            echo "========================================"


            if [ ! -s "$VAULT" ]; then

              echo "ERRO: patchvault.bin não foi gerado."
              exit 1
            fi


            if [ ! -s "$PATCH_BRIDGE" ]; then

              echo "ERRO: PatchVaultBridge.generated.c não foi gerado."
              exit 1
            fi


            echo
            echo "Patch vault:"
            ls -lh "$VAULT"

            echo
            echo "Bridge:"
            ls -lh "$PATCH_BRIDGE"


            # ======================================================
            # REMOVER PATCHES CRUS
            # ======================================================

            echo
            echo "========================================"
            echo "REMOVENDO PATCHES .3105 CRUS"
            echo "========================================"

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete


          else

            echo
            echo "Nenhum .3105 novo encontrado."
            echo "Usando patch vault existente."


            if [ ! -s "$VAULT" ]; then

              echo "ERRO: patchvault.bin não existe."
              exit 1
            fi


            if [ ! -s "$PATCH_BRIDGE" ]; then

              echo "ERRO: PatchVaultBridge.generated.c não existe."
              exit 1
            fi

          fi


          # ========================================================
          # VALIDAR SOURCE FINAL
          # ========================================================

          echo
          echo "========================================"
          echo "VALIDANDO SOURCE FINAL"
          echo "========================================"


          RAW_PATCH_COUNT="$(
            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"


          echo ".3105 crus restantes: $RAW_PATCH_COUNT"


          if [ "$RAW_PATCH_COUNT" -ne 0 ]; then

            echo
            echo "ERRO: ainda existem arquivos .3105 crus."

            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              -print

            exit 1
          fi


          if [ ! -s "$VAULT" ]; then

            echo "ERRO: patchvault.bin ausente."
            exit 1
          fi


          if [ ! -s "$RESOURCE_VAULT" ]; then

            echo "ERRO: resourcevault.bin ausente."
            exit 1
          fi


          if [ ! -s "$AUTH" ]; then

            echo "ERRO: ExternalAuth.dylib ausente."
            exit 1
          fi


          echo
          echo "Patch vault:"
          ls -lh "$VAULT"

          echo
          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

          echo
          echo "External Auth:"
          ls -lh "$AUTH"


          echo
          echo "========================================"
          echo "SOURCE PREPARADA COM SUCESSO"
          echo "========================================"



      # ============================================================
      # XCODE
      # ============================================================

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcodebuild -showsdks



      # ============================================================
      # BUILD
      # ============================================================

      - name: Build unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"


          echo "========================================"
          echo "BUILD EXTREME AUTH"
          echo "========================================"

          echo
          echo "Projeto:"
          echo "$PROJECT"


          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e


          echo
          echo "xcodebuild exit code: $RC"


          if [ "$RC" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld |Undefined symbols|duplicate symbol' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 250 || true

            exit "$RC"
          fi


          echo
          echo "========================================"
          echo "BUILD CONCLUÍDO"
          echo "========================================"



      # ============================================================
      # VALIDAR E EMPACOTAR
      # ============================================================

      - name: Harden and package IPA
        shell: bash
        run: |
          set -euo pipefail


          APP="$(
            find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '3105.app' \
              -print \
              -quit
          )"


          if [ -z "$APP" ]; then

            echo "ERRO: 3105.app não encontrado."
            exit 1
          fi


          EXE="$APP/3105"


          if [ ! -f "$EXE" ]; then

            echo "ERRO: executável 3105 não encontrado."
            exit 1
          fi


          echo
          echo "========================================"
          echo "APP ENCONTRADO"
          echo "========================================"

          echo "$APP"


          echo
          echo "Executável:"
          ls -lh "$EXE"


          # ========================================================
          # VALIDAR MACH-O
          # ========================================================

          echo
          echo "========================================"
          echo "VALIDANDO VAULTS NO MACH-O"
          echo "========================================"


          if ! otool -l "$EXE" \
            | grep -q 'sectname __pv3105'; then

            echo "ERRO: __pv3105 não encontrado no executável."
            exit 1
          fi

          echo "__pv3105 OK"


          if ! otool -l "$EXE" \
            | grep -q 'sectname __rv3105'; then

            echo "ERRO: __rv3105 não encontrado no executável."
            exit 1
          fi

          echo "__rv3105 OK"


          # ========================================================
          # VALIDAR DEPENDÊNCIA DA AUTH
          # ========================================================

          echo
          echo "========================================"
          echo "VALIDANDO DEPENDÊNCIA EXTERNAL AUTH"
          echo "========================================"


          echo
          echo "Dependências do executável:"

          otool -L "$EXE"


          if ! otool -L "$EXE" \
            | grep -q '@rpath/ExternalAuth.dylib'; then

            echo
            echo "ERRO: executável não possui dependência forte de:"
            echo "@rpath/ExternalAuth.dylib"

            exit 1
          fi


          echo
          echo "@rpath/ExternalAuth.dylib OK"


          # ========================================================
          # VALIDAR DYLIB NO APP
          # ========================================================

          AUTH_APP="$APP/Frameworks/ExternalAuth.dylib"


          if [ ! -s "$AUTH_APP" ]; then

            echo
            echo "ERRO: ExternalAuth.dylib ausente no app."

            echo
            echo "Esperado:"
            echo "$AUTH_APP"

            echo
            echo "Frameworks encontrados:"

            find "$APP" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort

            exit 1
          fi


          echo
          echo "ExternalAuth.dylib incorporada:"
          ls -lh "$AUTH_APP"

          echo
          echo "Tipo:"
          file "$AUTH_APP"

          echo
          echo "Install name:"
          otool -D "$AUTH_APP" || true


          # ========================================================
          # REMOVER SÍMBOLOS
          # ========================================================

          echo
          echo "========================================"
          echo "STRIP"
          echo "========================================"

          echo "Removendo símbolos locais/debug..."

          strip -S -x "$EXE" || true
          strip -S -x "$AUTH_APP" || true


          # ========================================================
          # LIMPEZA
          # ========================================================

          echo
          echo "========================================"
          echo "LIMPANDO APP"
          echo "========================================"


          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"


          find "$APP" \
            -maxdepth 1 \
            -type d \
            -name '*.lproj' \
            -exec rm -rf {} +


          find "$APP" \
            -type f \
            -name '._*' \
            -delete 2>/dev/null || true


          find "$APP" \
            -type d \
            -name '__MACOSX' \
            -prune \
            -exec rm -rf {} + 2>/dev/null || true


          # ========================================================
          # GARANTIR QUE NÃO HÁ .3105 CRU
          # ========================================================

          RAW_APP="$(
            find "$APP" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"


          echo
          echo ".3105 crus no app: $RAW_APP"


          if [ "$RAW_APP" -ne 0 ]; then

            echo "ERRO: .3105 cru encontrado no app."

            find "$APP" \
              -type f \
              -name '*.3105' \
              -print

            exit 1
          fi


          # ========================================================
          # LPROJ
          # ========================================================

          LPROJ_COUNT="$(
            find "$APP" \
              -type d \
              -name '*.lproj' \
              | wc -l \
              | tr -d ' '
          )"


          echo ".lproj no app: $LPROJ_COUNT"


          if [ "$LPROJ_COUNT" -ne 0 ]; then

            echo "ERRO: .lproj ainda presente."
            exit 1
          fi


          # ========================================================
          # REVALIDAR AUTH APÓS LIMPEZA
          # ========================================================

          if [ ! -s "$APP/Frameworks/ExternalAuth.dylib" ]; then

            echo "ERRO: ExternalAuth.dylib ausente após limpeza."
            exit 1
          fi


          if ! otool -L "$EXE" \
            | grep -q '@rpath/ExternalAuth.dylib'; then

            echo "ERRO: dependência ExternalAuth perdida."
            exit 1
          fi


          # ========================================================
          # CRIAR PAYLOAD
          # ========================================================

          cd "$GITHUB_WORKSPACE"


          rm -rf Payload
          mkdir -p Payload


          cp -R "$APP" Payload/3105.app


          # Remove metadata macOS caso exista.
          find Payload \
            -type f \
            -name '._*' \
            -delete 2>/dev/null || true


          IPA="3105-EXTERNAL-UI-1.0.1-EXTREME-AUTH-unsigned.ipa"


          rm -f "$IPA"


          echo
          echo "========================================"
          echo "GERANDO IPA"
          echo "========================================"


          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"


          # ========================================================
          # VALIDAR IPA FINAL
          # ========================================================

          echo
          echo "========================================"
          echo "VALIDANDO IPA FINAL"
          echo "========================================"


          if [ ! -s "$IPA" ]; then

            echo "ERRO: IPA não foi criada."
            exit 1
          fi


          RAW_IPA="$(
            unzip -l "$IPA" \
              | grep -c '\.3105$' || true
          )"


          echo ".3105 crus na IPA: $RAW_IPA"


          if [ "$RAW_IPA" -ne 0 ]; then

            echo "ERRO: .3105 cru encontrado na IPA."
            exit 1
          fi


          LPROJ_IPA="$(
            unzip -l "$IPA" \
              | grep -c '\.lproj/' || true
          )"


          echo ".lproj na IPA: $LPROJ_IPA"


          if [ "$LPROJ_IPA" -ne 0 ]; then

            echo "ERRO: .lproj encontrado na IPA."
            exit 1
          fi


          AUTH_IPA="$(
            unzip -l "$IPA" \
              | grep -c 'Payload/3105.app/Frameworks/ExternalAuth.dylib' || true
          )"


          echo "ExternalAuth.dylib na IPA: $AUTH_IPA"


          if [ "$AUTH_IPA" -lt 1 ]; then

            echo "ERRO: ExternalAuth.dylib não entrou na IPA."
            exit 1
          fi


          MACOSX_IPA="$(
            unzip -l "$IPA" \
              | grep -c '__MACOSX/' || true
          )"


          echo "__MACOSX na IPA: $MACOSX_IPA"


          if [ "$MACOSX_IPA" -ne 0 ]; then

            echo "ERRO: __MACOSX encontrado na IPA."
            exit 1
          fi


          echo
          echo "========================================"
          echo "IPA EXTREME AUTH CRIADA"
          echo "========================================"

          ls -lh "$IPA"



      # ============================================================
      # UPLOAD IPA
      # ============================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-EXTREME-AUTH-unsigned-ipa
          path: 3105-EXTERNAL-UI-1.0.1-EXTREME-AUTH-unsigned.ipa
          if-no-files-found: error
          retention-days: 14



      # ============================================================
      # LOG DE ERRO
      # ============================================================

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-extreme-auth-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
