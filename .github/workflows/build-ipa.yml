name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build Payload
          mkdir -p source

          unzip -q "3105-1.0.0-EXTERNAL-UI-source.zip" -d source

          PROJECT="$(find "$GITHUB_WORKSPACE/source" \
            -type d -name 'ThreeOneOSFive.xcodeproj' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ThreeOneOSFive.xcodeproj não encontrado"
            find source -maxdepth 4 -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT"

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type d -name '3105.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "3105.app não encontrado"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            3105-EXTERNAL-UI-unsigned.ipa

          ls -lh 3105-EXTERNAL-UI-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-EXTERNAL-UI-unsigned-ipa
          path: 3105-EXTERNAL-UI-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
